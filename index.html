<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KAHA 회원병원 실무 소식지</title>
<meta name="description" content="한국동물병원협회(KAHA) 회원병원 수의사를 위한 요일별 실무 소식지 — 진료 가이드라인·노무·서식·경영·법규">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐾</text></svg>">
<style>
  :root {
    --bg: #f6f8fb;
    --surface: #ffffff;
    --ink: #26221f;        /* KAHA 차콜 #231916 계열 */
    --ink-soft: #5f6b78;
    --accent: #035293;     /* KAHA 블루 */
    --accent-soft: #e9f1f8;
    --line: #d8e1ea;
    --code-bg: #eef2f7;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f151c;
      --surface: #161e28;
      --ink: #dbe3ea;
      --ink-soft: #8fa0b0;
      --accent: #7ab1e3;
      --accent-soft: #14293f;
      --line: #253140;
      --code-bg: #1b2531;
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Apple SD Gothic Neo", "Pretendard", "Noto Sans KR", "Malgun Gothic", sans-serif;
    line-height: 1.75;
    font-size: 16px;
  }
  header { border-bottom: 1px solid var(--line); background: var(--surface); }
  .head-inner {
    max-width: 46rem;
    margin: 0 auto;
    padding: 1.1rem 1.25rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1rem;
    flex-wrap: wrap;
  }
  .brand { display: flex; align-items: center; gap: 0.9rem; }
  .brand .logo-chip {
    background: #ffffff;
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 0.35rem 0.55rem;
    display: flex;
    align-items: center;
    cursor: pointer;
  }
  .brand .logo-chip:hover { border-color: var(--accent); }
  .brand .logo-chip:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .brand img { height: 44px; display: block; }
  .brand .titles { line-height: 1.3; }
  .site-title { font-size: 1.05rem; font-weight: 800; letter-spacing: -0.01em; }
  .site-title .sub {
    display: block;
    font-size: 0.78rem;
    font-weight: 500;
    color: var(--ink-soft);
    letter-spacing: 0.02em;
    margin-top: 0.15rem;
  }
  select {
    font: inherit;
    font-size: 0.85rem;
    color: var(--ink);
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 0.35rem 0.6rem;
  }
  select:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  .controls { display: flex; align-items: center; gap: 0.6rem; flex-wrap: wrap; }
  #searchBox {
    font: inherit;
    font-size: 0.85rem;
    color: var(--ink);
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 0.35rem 0.9rem;
    width: 15.5rem;
    max-width: 100%;
  }
  #searchBox:focus { outline: 2px solid var(--accent); outline-offset: 1px; border-color: var(--accent); }
  .search-hit {
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 0.8rem 1rem;
    margin: 0.7rem 0;
    background: var(--surface);
    cursor: pointer;
  }
  .search-hit:hover { border-color: var(--accent); }
  .search-hit .hit-meta { font-size: 0.78rem; color: var(--accent); font-weight: 700; }
  .search-hit .hit-title { font-weight: 700; margin: 0.15rem 0 0.3rem; }
  .search-hit .hit-snippet { font-size: 0.88rem; color: var(--ink-soft); line-height: 1.6; }
  .search-hit mark { background: var(--accent-soft); color: var(--accent); border-radius: 3px; padding: 0 0.15em; }
  .themes {
    max-width: 46rem;
    margin: 0 auto;
    padding: 0.8rem 1.25rem 0;
    display: flex;
    gap: 0.45rem;
    flex-wrap: wrap;
  }
  .theme-chip {
    font-size: 0.78rem;
    border: 1px solid var(--line);
    background: var(--surface);
    color: var(--ink-soft);
    border-radius: 999px;
    padding: 0.15rem 0.7rem;
    white-space: nowrap;
  }
  .theme-chip strong { color: var(--ink); font-weight: 700; margin-right: 0.25rem; }
  .theme-chip.active { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }
  .theme-chip.active strong { color: var(--accent); }
  main { max-width: 46rem; margin: 0 auto; padding: 1.2rem 1.25rem 4rem; }
  #issue-badge {
    display: none;
    font-size: 0.8rem;
    font-weight: 700;
    color: var(--accent);
    background: var(--accent-soft);
    border-radius: 6px;
    padding: 0.2rem 0.65rem;
    margin-bottom: 0.4rem;
  }
  #status { color: var(--ink-soft); font-size: 0.9rem; }
  article { word-break: keep-all; overflow-wrap: break-word; }
  article h1 { font-size: 1.45rem; line-height: 1.4; letter-spacing: -0.02em; text-wrap: balance; margin-top: 0.5em; }
  article h2 {
    font-size: 1.12rem;
    margin-top: 2.2em;
    padding-top: 1.1em;
    border-top: 1px solid var(--line);
    letter-spacing: -0.01em;
  }
  article h3 { font-size: 1rem; margin-top: 1.6em; }
  article a { color: var(--accent); text-underline-offset: 3px; }
  article blockquote {
    margin: 1em 0;
    padding: 0.6em 1em;
    border-left: 3px solid var(--accent);
    background: var(--accent-soft);
    border-radius: 0 8px 8px 0;
    color: var(--ink-soft);
    font-size: 0.92rem;
  }
  article blockquote p { margin: 0.3em 0; }
  article code { background: var(--code-bg); border-radius: 4px; padding: 0.1em 0.4em; font-size: 0.88em; }
  article pre { background: var(--code-bg); border-radius: 8px; padding: 1em; overflow-x: auto; }
  article pre code { background: none; padding: 0; }
  article hr { border: none; border-top: 1px solid var(--line); margin: 2.2em 0; }
  article ul, article ol { padding-left: 1.4em; }
  article li { margin: 0.35em 0; }
  article img {
    max-width: min(100%, 21.5rem);
    height: auto;
    display: inline-block;
    vertical-align: top;
    margin: 0.25rem 0.4rem 0.25rem 0;
    border: 1px solid var(--line);
    border-radius: 10px;
  }
  article table { border-collapse: collapse; width: 100%; display: block; overflow-x: auto; }
  article th, article td { border: 1px solid var(--line); padding: 0.45em 0.7em; font-size: 0.92rem; }
  /* ── 양식 모음 ── */
  .nav-link {
    background: none; border: 1px solid var(--line); border-radius: 999px;
    padding: 0.3rem 0.8rem; font: inherit; font-size: 0.82rem;
    color: var(--ink-soft); cursor: pointer; white-space: nowrap;
  }
  .nav-link:hover { border-color: var(--accent); color: var(--accent); }
  .nav-link.active { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); font-weight: 600; }
  #forms { display: none; }
  #forms.on { display: block; }
  .forms-head { margin: 0 0 1.6rem; }
  .forms-head h1 { font-size: 1.45rem; margin: 0 0 0.4rem; letter-spacing: -0.02em; }
  .forms-head p { margin: 0; color: var(--ink-soft); font-size: 0.9rem; line-height: 1.6; }
  .fsearch {
    display: flex; gap: 0.5rem; flex-wrap: wrap; align-items: center;
    margin: 0 0 1rem;
  }
  .fsearch input {
    flex: 1 1 16rem; font: inherit; font-size: 0.9rem;
    padding: 0.5rem 0.8rem; border: 1px solid var(--line); border-radius: 8px;
    background: var(--card); color: var(--ink);
  }
  .fsearch input:focus { outline: 2px solid var(--accent-soft); border-color: var(--accent); }
  .fsearch .cnt { color: var(--ink-soft); font-size: 0.82rem; white-space: nowrap; }
  .fchips { display: flex; flex-wrap: wrap; gap: 0.35rem; margin: 0 0 1.4rem; }
  .fchip {
    border: 1px solid var(--line); border-radius: 999px; background: none;
    font: inherit; font-size: 0.78rem; padding: 0.26rem 0.7rem;
    color: var(--ink-soft); cursor: pointer; white-space: nowrap;
  }
  .fchip:hover { border-color: var(--accent); color: var(--accent); }
  .fchip.on { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  .fgroup > h2 {
    font-size: 1.05rem; margin: 0 0 0.2rem; color: var(--ink);
  }
  .fgroup > p { margin: 0.3rem 0 1rem; color: var(--ink-soft); font-size: 0.84rem; }
  .fcat { margin: 0 0 2rem; }
  .fcat > h2 {
    font-size: 1rem; margin: 0 0 0.15rem; color: var(--accent);
    border-bottom: 2px solid var(--accent-soft); padding-bottom: 0.4rem;
  }
  .fcat > p { margin: 0.45rem 0 0.9rem; color: var(--ink-soft); font-size: 0.82rem; }
  .fitem {
    border: 1px solid var(--line); border-radius: 10px;
    padding: 0.85rem 1rem; margin-bottom: 0.6rem;
    display: flex; flex-wrap: wrap; gap: 0.5rem 1rem;
    align-items: center; justify-content: space-between;
  }
  .fitem .t { flex: 1 1 15rem; min-width: 0; }
  .fitem .t strong { display: block; font-size: 0.95rem; word-break: keep-all; }
  .fitem .t span { display: block; color: var(--ink-soft); font-size: 0.82rem; margin-top: 0.2rem; word-break: keep-all; }
  .fitem .dl { display: flex; gap: 0.4rem; flex-shrink: 0; }
  .fitem .dl a {
    text-decoration: none; font-size: 0.8rem; font-weight: 600;
    border: 1px solid var(--line); border-radius: 7px;
    padding: 0.32rem 0.7rem; color: var(--ink-soft);
  }
  .fitem .dl a:hover { border-color: var(--accent); color: var(--accent); }
  .fitem .dl a.pdf { background: var(--accent); border-color: var(--accent); color: #fff; }
  .fitem .dl a.pdf:hover { background: var(--accent-dk, #023A68); color: #fff; }
  footer {
    max-width: 46rem;
    margin: 0 auto;
    padding: 0 1.25rem 2.5rem;
    color: var(--ink-soft);
    font-size: 0.8rem;
  }
</style>
</head>
<body>
<header>
  <div class="head-inner">
    <div class="brand">
      <!-- 협회 공식 로고 파일을 assets/kaha-logo.png 로 넣으면 자동 표시됩니다 (없으면 숨김). 클릭 시 최신 호로 이동 -->
      <a class="logo-chip" href="./" hidden title="최신 호로 이동"
        aria-label="KAHA 소식지 홈 — 최신 호로 이동"><img src="assets/kaha-logo.png"
        alt="KAHA 한국동물병원협회 로고" onload="this.parentElement.hidden=false"></a>
      <div class="titles">
        <div class="site-title">KAHA 회원병원 실무 소식지
          <span class="sub">한국동물병원협회 정책기획위원회 · 요일별 발행</span>
        </div>
      </div>
    </div>
    <div class="controls">
      <input type="search" id="searchBox" placeholder="전체 호 검색 (예: 백신, 연차, 마약류)"
        aria-label="소식지 전체 검색" autocomplete="off">
      <label>지난 호
        <select id="datePicker" aria-label="소식지 날짜 선택"></select>
      </label>
      <button type="button" class="nav-link" id="navForms">양식 모음</button>
    </div>
  </div>
  <nav class="themes" id="themeNav" aria-label="요일별 테마"></nav>
</header>
<main>
  <span id="issue-badge"></span>
  <p id="status">소식지를 불러오는 중…</p>
  <article id="content"></article>
  <section id="forms" aria-label="양식 모음"></section>
</main>
<footer>
  본 소식지는 KAHA 회원병원 수의사를 위한 참고 자료입니다.
  노무·세무·법률 관련 내용은 일반적 안내이며 개별 사안은 반드시 전문가(공인노무사·세무사·변호사) 자문과
  법령 원문을 확인하시기 바랍니다. 진료 가이드라인 요약은 원문 출처를 함께 확인하세요.
</footer>
<script src="assets/marked.min.js"></script>
<script>
(function () {
  var THEMES = [
    { day: 1, label: "월", name: "진료 가이드라인" },
    { day: 2, label: "화", name: "노무·인사" },
    { day: 3, label: "수", name: "서식·양식" },
    { day: 4, label: "목", name: "경영·세무" },
    { day: 5, label: "금", name: "법규·정책" }
  ];
  var status = document.getElementById("status");
  var content = document.getElementById("content");
  var picker = document.getElementById("datePicker");
  var badge = document.getElementById("issue-badge");
  var themeNav = document.getElementById("themeNav");

  THEMES.forEach(function (t) {
    var chip = document.createElement("span");
    chip.className = "theme-chip";
    chip.id = "chip-" + t.day;
    chip.innerHTML = "<strong>" + t.label + "</strong>" + t.name;
    themeNav.appendChild(chip);
  });

  function themeOf(dateStr) {
    var d = new Date(dateStr + "T00:00:00");
    var dow = d.getDay();
    for (var i = 0; i < THEMES.length; i++) if (THEMES[i].day === dow) return THEMES[i];
    return null;
  }

  function show(md, dateStr) {
    content.innerHTML = marked.parse(md);
    var h1 = content.querySelector("h1");
    if (h1) h1.textContent = h1.textContent.replace(/^\s*\[[^\]]*\]\s*/, "");
    content.querySelectorAll("a[href]").forEach(function (a) {
      a.target = "_blank";
      a.rel = "noopener noreferrer";
    });
    status.textContent = "";
    var t = themeOf(dateStr);
    THEMES.forEach(function (x) {
      document.getElementById("chip-" + x.day).className =
        "theme-chip" + (t && x.day === t.day ? " active" : "");
    });
    if (t) {
      badge.style.display = "inline-block";
      badge.textContent = t.label + "요일 · " + t.name;
    } else {
      badge.style.display = "none";
    }
  }

  function loadDate(d) {
    showIssueView();
    status.textContent = "소식지를 불러오는 중…";
    fetch("issues/" + d + ".md", { cache: "no-store" })
      .then(function (r) { if (!r.ok) throw new Error(r.status); return r.text(); })
      .then(function (md) { show(md, d); })
      .catch(function () { status.textContent = "이 날짜의 소식지를 불러오지 못했습니다."; });
  }

  // ── 양식 모음 ────────────────────────────────────────────────
  var formsEl = document.getElementById("forms");
  var navForms = document.getElementById("navForms");
  var FORMS = null;

  function showIssueView() {
    formsEl.classList.remove("on");
    content.style.display = "";
    badge.style.display = badge.textContent ? "inline-block" : "none";
    themeNav.style.display = "";
    navForms.classList.remove("active");
  }

  function showFormsView() {
    content.style.display = "none";
    badge.style.display = "none";
    themeNav.style.display = "none";
    status.textContent = "";
    formsEl.classList.add("on");
    navForms.classList.add("active");
    if (FORMS) return;
    formsEl.innerHTML = "<p>양식 목록을 불러오는 중…</p>";
    fetch("forms.json", { cache: "no-store" })
      .then(function (r) { return r.json(); })
      .then(function (data) { FORMS = data; renderForms(data); })
      .catch(function () { formsEl.innerHTML = "<p>양식 목록을 불러오지 못했습니다.</p>"; });
  }

  var FQ = "", FCAT = "";

  function fmatch(it, q) {
    if (!q) return true;
    var hay = (it.name + " " + (it.desc || "") + " " + (it.kw || "")).toLowerCase();
    return hay.indexOf(q) !== -1;
  }

  function renderForms(data) {
    var q = FQ.trim().toLowerCase();
    var shown = 0, body = "";
    data.groups.forEach(function (g) {
      var cats = "";
      g.cats.forEach(function (c) {
        if (FCAT && FCAT !== g.key + "/" + c.folder) return;
        var hits = c.items.filter(function (it) { return fmatch(it, q); });
        if (!hits.length) return;
        shown += hits.length;
        cats += '<div class="fcat"><h2>' + esc(c.label) + "</h2>"
          + (c.blurb ? "<p>" + esc(c.blurb) + "</p>" : "");
        hits.forEach(function (it) {
          cats += '<div class="fitem"><div class="t"><strong>' + esc(it.name) + "</strong>"
            + (it.desc ? "<span>" + esc(it.desc) + "</span>" : "") + '</div><div class="dl">';
          if (it.pdf) cats += '<a class="pdf" href="' + encodeURI(it.pdf) + '" target="_blank" rel="noopener noreferrer">PDF</a>';
          if (it.docx) cats += '<a href="' + encodeURI(it.docx) + '" target="_blank" rel="noopener noreferrer">워드</a>';
          cats += "</div></div>";
        });
        cats += "</div>";
      });
      if (cats) {
        body += '<div class="fgroup"><h2>' + esc(g.label) + "</h2>"
          + (g.blurb ? "<p>" + esc(g.blurb) + "</p>" : "") + cats + "</div>";
      }
    });
    if (!body) body = "<p>검색 결과가 없습니다.</p>";

    var chips = '<div class="fchips"><button type="button" class="fchip' + (FCAT ? "" : " on")
      + '" data-cat="">전체</button>';
    data.groups.forEach(function (g) {
      g.cats.forEach(function (c) {
        var key = g.key + "/" + c.folder;
        chips += '<button type="button" class="fchip' + (FCAT === key ? " on" : "")
          + '" data-cat="' + key + '">' + esc(c.label) + " " + c.items.length + "</button>";
      });
    });
    chips += "</div>";

    formsEl.innerHTML = '<div class="forms-head"><h1>양식 모음</h1>'
      + "<p>회원병원에서 바로 쓰실 수 있는 양식 " + data.count + "종입니다. "
      + "인쇄해서 바로 쓰실 수 있고, 워드 파일은 자유롭게 고쳐 쓰실 수 있습니다. 모두 A4 한 장입니다.</p></div>"
      + '<div class="fsearch"><input type="search" id="fq" placeholder="양식 · 진단명 검색 (예: 슬개골, 백내장, 수혈, 발치)" '
      + 'value="' + esc(FQ) + '" autocomplete="off"><span class="cnt">' + shown + "종 표시</span></div>"
      + chips + body;

    var box = document.getElementById("fq");
    box.addEventListener("input", function () {
      FQ = box.value;
      var pos = box.selectionStart;
      renderForms(data);
      var nb = document.getElementById("fq");
      nb.focus();
      try { nb.setSelectionRange(pos, pos); } catch (e) {}
    });
    formsEl.querySelectorAll(".fchip").forEach(function (b) {
      b.addEventListener("click", function () {
        FCAT = b.getAttribute("data-cat");
        renderForms(data);
      });
    });
  }

  navForms.addEventListener("click", function () {
    if (formsEl.classList.contains("on")) showIssueView();
    else showFormsView();
  });

  // ── 전체 호 검색 ──────────────────────────────────────────────
  var searchBox = document.getElementById("searchBox");
  var INDEX = null;
  var ALL_DATES = [];

  function esc(s) {
    return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }
  function plainText(md) {
    return md
      .replace(/```[\s\S]*?```/g, " ")
      .replace(/!\[[^\]]*\]\([^\)]*\)/g, " ")
      .replace(/\[([^\]]*)\]\([^\)]*\)/g, "$1")
      .replace(/^>\s?/gm, "")
      .replace(/[#*_`|>-]+/g, " ")
      .replace(/\s+/g, " ")
      .trim();
  }
  function buildIndex() {
    if (INDEX) return Promise.resolve(INDEX);
    return Promise.all(ALL_DATES.map(function (d) {
      return fetch("issues/" + d + ".md", { cache: "no-store" })
        .then(function (r) { return r.ok ? r.text() : ""; })
        .then(function (md) {
          var first = (md.split("\n")[0] || "").replace(/^#\s*/, "").replace(/^\[[^\]]*\]\s*/, "");
          return { d: d, title: first, text: plainText(md) };
        });
    })).then(function (list) { INDEX = list; return list; });
  }
  function highlight(text, q) {
    var out = "", lower = text.toLowerCase(), ql = q.toLowerCase(), pos = 0;
    while (true) {
      var i = lower.indexOf(ql, pos);
      if (i === -1) { out += esc(text.slice(pos)); break; }
      out += esc(text.slice(pos, i)) + "<mark>" + esc(text.slice(i, i + q.length)) + "</mark>";
      pos = i + q.length;
    }
    return out;
  }
  function renderSearch(q) {
    buildIndex().then(function (list) {
      if (searchBox.value.trim() !== q) return; // 최신 입력만 반영
      var hits = list.filter(function (it) {
        return (it.title + " " + it.text).toLowerCase().indexOf(q.toLowerCase()) !== -1;
      });
      badge.style.display = "none";
      THEMES.forEach(function (x) { document.getElementById("chip-" + x.day).className = "theme-chip"; });
      status.textContent = "「" + q + "」 검색 결과 " + hits.length + "건";
      content.innerHTML = "";
      hits.forEach(function (it) {
        var t = themeOf(it.d);
        var idx = it.text.toLowerCase().indexOf(q.toLowerCase());
        var start = Math.max(0, idx - 55);
        var snippet = (start > 0 ? "…" : "") + it.text.slice(start, Math.min(it.text.length, idx + 105)) + "…";
        var div = document.createElement("div");
        div.className = "search-hit";
        div.innerHTML = '<div class="hit-meta">' + it.d + (t ? " · " + t.label + "요일 " + t.name : "") + "</div>" +
          '<div class="hit-title">' + highlight(it.title, q) + "</div>" +
          '<div class="hit-snippet">' + highlight(snippet, q) + "</div>";
        div.addEventListener("click", function () {
          picker.value = it.d;
          history.replaceState(null, "", "?d=" + it.d);
          loadDate(it.d);
          window.scrollTo(0, 0);
        });
        content.appendChild(div);
      });
      if (!hits.length) {
        content.innerHTML = '<p style="color: var(--ink-soft)">다른 검색어로 시도해 보세요. 제목과 본문 전체에서 찾습니다.</p>';
      }
    });
  }
  var searchTimer = null;
  searchBox.addEventListener("input", function () {
    clearTimeout(searchTimer);
    var q = searchBox.value.trim();
    if (q.length < 2) {
      if (q.length === 0) loadDate(picker.value);
      return;
    }
    status.textContent = "검색 중…";
    searchTimer = setTimeout(function () { renderSearch(q); }, 250);
  });

  fetch("archive.json", { cache: "no-store" })
    .then(function (r) { return r.json(); })
    .then(function (a) {
      ALL_DATES = a.dates.slice();
      var params = new URLSearchParams(location.search);
      var want = params.get("d");
      var current = (want && a.dates.indexOf(want) !== -1) ? want : a.latest;
      a.dates.slice().sort().reverse().forEach(function (d) {
        var o = document.createElement("option");
        var t = themeOf(d);
        o.value = d;
        o.textContent = d + (t ? " (" + t.label + ") " : " ") + (d === a.latest ? "· 최신" : "");
        picker.appendChild(o);
      });
      picker.value = current;
      picker.addEventListener("change", function () {
        loadDate(picker.value);
        history.replaceState(null, "", "?d=" + picker.value);
      });
      loadDate(current);
    })
    .catch(function () { status.textContent = "목록을 불러오지 못했습니다."; });
})();
</script>
</body>
</html>
